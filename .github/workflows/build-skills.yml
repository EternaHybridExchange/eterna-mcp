name: Build Skills Zip

on:
  push:
    branches: [main, feat/workshop]
    paths:
      - 'skills/claude-ai/**'
      - '.github/workflows/build-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package claude-ai skill
        run: |
          mkdir -p dist

          # Structure expected by claude.ai:
          # eterna-trading/
          #   Skill.md
          #   resources/
          #     market-scan.md
          #     deposit.md
          #     ...
          mkdir -p staging/eterna-trading

          cp skills/claude-ai/Skill.md staging/eterna-trading/Skill.md

          if [ -d skills/claude-ai/resources ]; then
            cp -r skills/claude-ai/resources staging/eterna-trading/resources
          fi

          cd staging
          zip -r ../dist/eterna-trading.zip eterna-trading/
          cd ..

          echo "## Packaged skill:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l dist/eterna-trading.zip >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eterna-trading
          path: dist/eterna-trading.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          RELEASE_TAG="skill-v$(date +%Y%m%d)-${SHORT_SHA::7}"

          gh release create "$RELEASE_TAG" \
            --title "Eterna Trading Skill for Claude.ai" \
            --notes "Trading skill for Claude.ai with Eterna MCP Gateway.

          **Download eterna-trading.zip** and upload it to your Claude.ai project as a skill.

          Contains:
          - **Skill.md** — core trading agent instructions (router, market analysis, trading, deposits, withdrawals)
          - **resources/** — detailed per-capability guides loaded by Claude on demand" \
            --latest \
            dist/eterna-trading.zip
